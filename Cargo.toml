[package]
name = "dryserver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Turn old laptops into a private, encrypted server cluster with one USB stick."
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
