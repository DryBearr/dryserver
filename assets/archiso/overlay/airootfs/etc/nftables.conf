#!/usr/bin/nft -f
# dryserver live installer firewall: nothing may connect in.
# Replies to connections this machine opens (downloads, registration) pass.
# DHCP uses raw sockets and is not affected.

destroy table inet dryserver_live

table inet dryserver_live {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state vmap { established : accept, related : accept, invalid : drop }
		iif lo accept
		# IPv6 needs neighbor discovery and router adverts to work at all.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
